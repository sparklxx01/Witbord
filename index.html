<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witbord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-slate-100 text-slate-800 overflow-hidden select-none">

    <header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-10 shadow-sm flex-shrink-0">
        <div class="flex items-center space-x-3">
            <div>
                <h1 class="font-bold text-slate-900 text-sm leading-tight">WITBOARD canvas</h1>
                <p class="text-xs text-slate-500">vectoring the vector</p>
            </div>
        </div>

        <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button id="tool-brush" onclick="setTool('brush')" class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 bg-slate-900 text-white shadow-sm transition-all" title="Brush Tool">
                <i class="fa-solid fa-paint-brush"></i>
                <span class="hidden sm:inline">Brush</span>
            </button>
            <button id="tool-lasso" onclick="setTool('lasso')" class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 text-slate-600 hover:text-slate-900 transition-all" title="Lasso Select & Move">
                <i class="fa-solid fa-lasso"></i>
                <span class="hidden sm:inline">Lasso Select</span>
            </button>
            <button id="tool-lassofill" onclick="setTool('lassofill')" class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 text-slate-600 hover:text-slate-900 transition-all" title="Lasso Fill Area">
                <i class="fa-solid fa-draw-polygon"></i>
                <span class="hidden sm:inline">Lasso Fill</span>
            </button>
            <button id="tool-pan" onclick="setTool('pan')" class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 text-slate-600 hover:text-slate-900 transition-all" title="Pan Canvas">
                <i class="fa-solid fa-hand"></i>
                <span class="hidden sm:inline">Pan (Space)</span>
            </button>
            <div class="h-4 w-px bg-slate-300 mx-1"></div>
            <button onclick="triggerImageUpload()" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all" title="Import Image">
                <i class="fa-solid fa-image text-sm"></i>
            </button>
            <input type="file" id="image-loader" accept="image/*" class="hidden" onchange="handleImageImport(event)">
        </div>

        <div class="flex items-center space-x-3">
            <div id="collaborators-container" class="hidden md:flex items-center -space-x-1.5 overflow-hidden">
            </div>

            <button onclick="copyRoomLink()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-2.5 py-1.5 rounded-lg shadow-sm flex items-center space-x-1.5 transition-all" title="Share Room Link">
                <i class="fa-solid fa-share-nodes"></i>
                <span id="room-code-label" class="font-mono text-xs">Share</span>
            </button>

            <button onclick="openRoomModal()" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-all" title="Switch Room">
                <i class="fa-solid fa-door-open text-sm"></i>
            </button>

            <div class="h-4 w-px bg-slate-200 my-auto"></div>

            <button onclick="undo()" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-all" title="Undo (Ctrl+Z)">
                <i class="fa-solid fa-rotate-left text-sm"></i>
            </button>
            <button onclick="redo()" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-all" title="Redo (Ctrl+Y)">
                <i class="fa-solid fa-rotate-right text-sm"></i>
            </button>
            <div class="h-4 w-px bg-slate-200 my-auto"></div>
            <button onclick="exportPNG()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm flex items-center space-x-1.5 transition-all">
                <i class="fa-solid fa-download"></i>
                <span>Export</span>
            </button>
            <button onclick="toggleLayersPanel()" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-all relative" title="Toggle Layers">
                <i class="fa-solid fa-layer-group text-sm"></i>
            </button>
        </div>
    </header>

    <div class="bg-white border-b border-slate-200 px-6 py-2 flex flex-wrap items-center justify-between text-xs gap-4 z-10 flex-shrink-0">
        <div class="flex items-center space-x-6 flex-wrap gap-y-2">
            <div class="flex items-center space-x-2">
                <span class="text-slate-500 font-medium">Color:</span>
                <input type="color" id="color-picker" value="#0f172a" class="w-7 h-7 rounded-lg cursor-pointer border border-slate-200 p-0.5 bg-white" onchange="updateBrushColor(this.value)">
                <div class="flex items-center space-x-1">
                    <button onclick="setQuickColor('#0f172a')" class="w-5 h-5 rounded-full bg-slate-900 border border-slate-300" title="Dark Slate"></button>
                    <button onclick="setQuickColor('#475569')" class="w-5 h-5 rounded-full bg-slate-600 border border-slate-300" title="Medium Slate"></button>
                    <button onclick="setQuickColor('#ef4444')" class="w-5 h-5 rounded-full bg-red-500 border border-slate-300" title="Red"></button>
                    <button onclick="setQuickColor('#10b981')" class="w-5 h-5 rounded-full bg-emerald-500 border border-slate-300" title="Emerald"></button>
                    <button onclick="setQuickColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500 border border-slate-300" title="Blue"></button>
                    <button onclick="setQuickColor('#8b5cf6')" class="w-5 h-5 rounded-full bg-purple-500 border border-slate-300" title="Purple"></button>
                </div>
            </div>

            <div class="flex items-center space-x-2 border-l border-slate-200 pl-4">
                <span class="text-slate-500 font-medium">Base Size:</span>
                <input type="range" id="size-slider" min="2" max="60" value="12" class="w-24 accent-slate-900" oninput="updateBrushSize(this.value)">
                <span id="size-val" class="w-8 font-mono text-slate-700">12px</span>
            </div>

            <div class="flex items-center space-x-4 border-l border-slate-200 pl-4">
                <label class="flex items-center space-x-2 cursor-pointer select-none">
                    <input type="checkbox" id="toggle-velocity" checked class="rounded text-slate-900 focus:ring-slate-800 w-4 h-4" onchange="toggleVelocityDynamics(this.checked)">
                    <span class="text-slate-700 font-medium">Velocity Tapering</span>
                </label>
                
                <div class="flex items-center space-x-2">
                    <label class="flex items-center space-x-2 cursor-pointer select-none">
                        <input type="checkbox" id="toggle-smoothing" checked class="rounded text-slate-900 focus:ring-slate-800 w-4 h-4" onchange="toggleSmoothing(this.checked)">
                        <span class="text-slate-700 font-medium">Stroke Smoothing:</span>
                    </label>
                    <input type="range" id="smoothing-slider" min="1" max="15" value="5" class="w-20 accent-slate-900" oninput="updateSmoothingLevel(this.value)">
                    <span id="smoothing-val" class="w-6 font-mono text-slate-700">5px</span>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-3 text-slate-400">
            <span id="zoom-level" class="font-mono text-slate-600 font-medium">100%</span>
            <button onclick="resetZoom()" class="hover:text-slate-900 text-xs text-slate-700 font-medium underline">Reset View</button>
        </div>
    </div>

    <div class="relative flex-1 bg-slate-200 overflow-hidden flex">
        <div id="canvas-container" class="relative w-full h-full cursor-crosshair">
            <canvas id="main-canvas" class="absolute inset-0 bg-white shadow-inner"></canvas>
        </div>

        <div id="layers-panel" class="hidden absolute right-4 top-4 bottom-4 w-64 bg-white border border-slate-200 rounded-xl shadow-xl flex flex-col z-20">
            <div class="p-3 border-b border-slate-100 flex items-center justify-between bg-slate-50 rounded-t-xl">
                <span class="font-bold text-xs text-slate-700 uppercase tracking-wider">Layers</span>
                <button onclick="addLayer()" class="p-1 text-slate-800 hover:bg-slate-200 rounded transition-all" title="Add Layer">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="layers-list" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar"></div>
        </div>

        <div id="selection-bar" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-xl shadow-2xl flex items-center space-x-4 z-30">
            <span class="text-xs text-slate-300"><span id="selected-count">0</span> object(s) selected</span>
            <div class="h-4 w-px bg-slate-700"></div>
            <span class="text-xs text-slate-400 italic"><i class="fa-solid fa-arrows-up-down-left-right mr-1"></i>Drag selection to move</span>
            <div class="h-4 w-px bg-slate-700"></div>
            <button onclick="duplicateSelection()" class="text-xs hover:text-slate-300 flex items-center space-x-1">
                <i class="fa-solid fa-copy"></i>
                <span>Duplicate</span>
            </button>
            <button onclick="deleteSelection()" class="text-xs text-red-400 hover:text-red-300 flex items-center space-x-1">
                <i class="fa-solid fa-trash"></i>
                <span>Delete</span>
            </button>
        </div>
    </div>

    <div id="room-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <h3 class="font-bold text-slate-900 text-base flex items-center space-x-2">
                    <i class="fa-solid fa-door-open text-emerald-600"></i>
                    <span>Multiplayer Room Settings</span>
                </h3>
                <button onclick="closeRoomModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 mb-4">Join an existing room code or create a new private room to draw together in real time.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Room Name / ID</label>
                    <input type="text" id="room-input" placeholder="e.g. vector-studio-1" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-slate-900 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Your Display Name</label>
                    <input type="text" id="user-name-input" placeholder="Your Name" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-slate-900 outline-none">
                </div>
            </div>

            <div class="flex items-center justify-end space-x-2 mt-6">
                <button onclick="closeRoomModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
                <button onclick="switchRoomFromModal()" class="px-4 py-2 text-xs font-medium bg-slate-900 text-white hover:bg-slate-800 rounded-xl shadow-sm">Join Room</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-16 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global environment variables provided by sandbox runtime or defaults
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vector-studio-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State definition
        window.state = {
            tool: 'brush', // 'brush', 'lasso', 'lassofill', 'pan'
            brushColor: '#0f172a',
            brushSize: 12,
            velocityDynamics: true,
            smoothing: true,
            smoothingTolerance: 5,
            zoom: 1,
            panOffset: { x: 0, y: 0 },
            isPanning: false,
            panStart: { x: 0, y: 0 },
            isDrawing: false,
            isLassoing: false,
            isLassoFilling: false,
            isMovingSelection: false,
            selectionDragStart: { x: 0, y: 0 },
            currentPoints: [],
            lassoPoints: [],
            layers: [
                { id: 'layer-1', name: 'Layer 1', visible: true, locked: false, elements: [] }
            ],
            activeLayerId: 'layer-1',
            selectedElements: [],
            undoStack: [],
            redoStack: [],
            
            // Real-time Multiplayer state
            currentRoomId: getRoomFromURL() || 'default-room',
            userId: null,
            userName: 'Artist ' + Math.floor(100 + Math.random() * 900),
            userColor: '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'),
            remoteCursors: {},
            collaborators: {}
        };

        let lastCursorBroadcast = 0;

        function getRoomFromURL() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#room=')) {
                return decodeURIComponent(hash.substring(6));
            }
            return null;
        }

        // Initialize Authentication and Firestore Observers
        async function initMultiplayer() {
            try {
                let userCred;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    userCred = await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    userCred = await signInAnonymously(auth);
                }

                state.userId = userCred.user.uid;
                updateRoomLabel();
                subscribeToRoomElements();
                subscribeToCursors();
                showToast(`Connected to live room: ${state.currentRoomId}`, 'success');
            } catch (err) {
                console.error("Multiplayer setup error:", err);
                showToast("Live sync error: operating in local fallback mode", "warning");
            }
        }

        // Firestore Paths - Follow Rule 1: /artifacts/{appId}/public/data/{collectionName}
        function getElementsCollectionPath() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'vector_elements');
        }

        function getCursorsCollectionPath() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'vector_cursors');
        }

        // Real-Time Elements Listener
        let unsubscribeElements = null;
        function subscribeToRoomElements() {
            if (unsubscribeElements) unsubscribeElements();

            const colRef = getElementsCollectionPath();
            unsubscribeElements = onSnapshot(colRef, (snapshot) => {
                const roomElements = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.roomId === state.currentRoomId) {
                        roomElements.push(data);
                    }
                });

                // Reconstruct image objects if necessary
                roomElements.forEach(el => {
                    if (el.type === 'image' && el.src && (!el.img || el.img.src !== el.src)) {
                        const img = new Image();
                        img.src = el.src;
                        el.img = img;
                    }
                });

                const activeLayer = state.layers.find(l => l.id === state.activeLayerId);
                if (activeLayer) {
                    activeLayer.elements = roomElements;
                }
                render();
            }, (error) => {
                console.error("Elements subscription error:", error);
            });
        }

        // Real-Time Cursors & Presence Listener
        let unsubscribeCursors = null;
        function subscribeToCursors() {
            if (unsubscribeCursors) unsubscribeCursors();

            const cursorsRef = getCursorsCollectionPath();
            unsubscribeCursors = onSnapshot(cursorsRef, (snapshot) => {
                const now = Date.now();
                const updatedCursors = {};
                const activeCollaborators = {};

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.roomId === state.currentRoomId && docSnap.id !== state.userId) {
                        // Filter out stale cursors inactive for > 15 seconds
                        if (now - (data.lastSeen || 0) < 15000) {
                            updatedCursors[docSnap.id] = data;
                            activeCollaborators[docSnap.id] = {
                                name: data.name,
                                color: data.color
                            };
                        }
                    }
                });

                state.remoteCursors = updatedCursors;
                state.collaborators = activeCollaborators;
                updateCollaboratorsUI();
                render();
            }, (error) => {
                console.error("Cursors subscription error:", error);
            });
        }

        // Broadcast current user's cursor position (throttled)
        window.broadcastCursorPosition = function(pt) {
            if (!state.userId || !db) return;

            const now = Date.now();
            if (now - lastCursorBroadcast < 50) return; // ~20fps throttle
            lastCursorBroadcast = now;

            const userCursorDoc = doc(db, 'artifacts', appId, 'public', 'data', 'vector_cursors', state.userId);
            setDoc(userCursorDoc, {
                x: pt.x,
                y: pt.y,
                name: state.userName,
                color: state.userColor,
                roomId: state.currentRoomId,
                lastSeen: now
            }, { merge: true }).catch(err => console.error("Cursor send error:", err));
        };

        // Firebase Persistence Wrappers
        window.addStorageElement = function(element) {
            saveUndoState();
            const activeLayer = state.layers.find(l => l.id === state.activeLayerId);
            if (activeLayer) {
                activeLayer.elements.push(element);
            }

            if (!state.userId || !db) return;

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'vector_elements', element.id);
            const payload = {
                ...element,
                roomId: state.currentRoomId,
                createdBy: state.userId,
                creatorName: state.userName,
                updatedAt: Date.now()
            };

            // Convert HTMLImageElement to src string for firestore compatibility
            if (payload.type === 'image' && payload.img) {
                payload.src = payload.img.src;
                delete payload.img;
            }

            setDoc(docRef, payload).catch(err => console.error("Firestore save error:", err));
        };

        window.updateElementInFirestore = function(element) {
            if (!state.userId || !db) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'vector_elements', element.id);
            const payload = { ...element, roomId: state.currentRoomId, updatedAt: Date.now() };
            if (payload.type === 'image' && payload.img) {
                payload.src = payload.img.src;
                delete payload.img;
            }
            setDoc(docRef, payload, { merge: true }).catch(err => console.error("Firestore update error:", err));
        };

        window.deleteElementFromFirestore = function(elementId) {
            if (!state.userId || !db) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'vector_elements', elementId);
            deleteDoc(docRef).catch(err => console.error("Firestore delete error:", err));
        };

        // Room switching
        window.switchRoom = function(newRoomId) {
            if (!newRoomId || newRoomId === state.currentRoomId) return;

            state.currentRoomId = newRoomId;
            window.location.hash = `room=${encodeURIComponent(newRoomId)}`;
            updateRoomLabel();

            const activeLayer = state.layers.find(l => l.id === state.activeLayerId);
            if (activeLayer) activeLayer.elements = [];

            subscribeToRoomElements();
            subscribeToCursors();
            showToast(`Switched to room: ${newRoomId}`, 'info');
        };

        window.initMultiplayer = initMultiplayer;
    </script>

    <script>
        // Main Canvas Engine & UI Logic
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            render();
        }

        window.addEventListener('resize', resizeCanvas);

        function processStrokePoints(rawPoints, baseSize, useVelocity, smoothingTol) {
            if (!rawPoints || rawPoints.length === 0) return [];

            const uniquePoints = [];
            const minDistThreshold = state.smoothing ? Math.max(0.8, smoothingTol * 0.3) : 0.5;

            for (let i = 0; i < rawPoints.length; i++) {
                if (i === 0) {
                    uniquePoints.push(rawPoints[i]);
                } else {
                    const prev = uniquePoints[uniquePoints.length - 1];
                    const dist = Math.hypot(rawPoints[i].x - prev.x, rawPoints[i].y - prev.y);
                    if (dist >= minDistThreshold) {
                        uniquePoints.push(rawPoints[i]);
                    }
                }
            }

            if (uniquePoints.length <= 1) {
                return [{
                    x: uniquePoints[0].x,
                    y: uniquePoints[0].y,
                    w: baseSize / 2
                }];
            }

            const interpolated = [];
            for (let i = 0; i < uniquePoints.length - 1; i++) {
                const p0 = uniquePoints[Math.max(0, i - 1)];
                const p1 = uniquePoints[i];
                const p2 = uniquePoints[i + 1];
                const p3 = uniquePoints[Math.min(uniquePoints.length - 1, i + 2)];

                const segmentDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                const steps = Math.max(2, Math.floor(segmentDist / 2.5));

                for (let t = 0; t < steps; t++) {
                    const factor = t / steps;
                    const factor2 = factor * factor;
                    const factor3 = factor2 * factor;

                    const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * factor + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * factor2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * factor3);
                    const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * factor + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * factor2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * factor3);
                    const time = p1.time + (p2.time - p1.time) * factor;

                    interpolated.push({ x, y, time });
                }
            }
            interpolated.push(uniquePoints[uniquePoints.length - 1]);

            const minSize = Math.max(1, baseSize * 0.15);
            const maxSize = baseSize / 2;

            let totalDist = 0;
            let totalTime = 0;
            const windowSize = Math.min(interpolated.length, 6);
            for (let i = 1; i < windowSize; i++) {
                totalDist += Math.hypot(interpolated[i].x - interpolated[i-1].x, interpolated[i].y - interpolated[i-1].y);
                totalTime += Math.max(1, interpolated[i].time - interpolated[i-1].time);
            }
            const initialVel = totalTime > 0 ? (totalDist / totalTime) : 0.5;

            const widths = [];
            let currentWidth = maxSize;

            for (let i = 0; i < interpolated.length; i++) {
                let targetW = maxSize;

                if (useVelocity) {
                    let v = initialVel;
                    if (i > 0) {
                        const dist = Math.hypot(interpolated[i].x - interpolated[i-1].x, interpolated[i].y - interpolated[i-1].y);
                        const dt = Math.max(1, interpolated[i].time - interpolated[i-1].time);
                        v = dist / dt;
                    }

                    const normalizedV = Math.min(Math.max(v, 0.05), 3.0);
                    const factor = 1 - (normalizedV / 3.0);
                    targetW = minSize + (maxSize - minSize) * (factor * 0.85 + 0.15);
                }

                if (i === 0) {
                    currentWidth = targetW;
                } else {
                    currentWidth = currentWidth + (targetW - currentWidth) * 0.25;
                }

                widths.push(currentWidth);
            }

            const totalCount = interpolated.length;
            const taperWindow = Math.min(Math.floor(totalCount / 2), 10);

            for (let i = 0; i < taperWindow; i++) {
                const ratio = (i + 1) / (taperWindow + 1);
                widths[i] = Math.min(widths[i], widths[i] * ratio + minSize * (1 - ratio));
                widths[totalCount - 1 - i] = Math.min(widths[totalCount - 1 - i], widths[totalCount - 1 - i] * ratio + minSize * (1 - ratio));
            }

            return interpolated.map((pt, i) => ({
                x: pt.x,
                y: pt.y,
                w: widths[i]
            }));
        }

        function drawTaperedStroke(context, points, color) {
            if (!points || points.length === 0) return;

            context.save();
            context.fillStyle = color;
            context.strokeStyle = color;

            if (points.length === 1) {
                context.beginPath();
                context.arc(points[0].x, points[0].y, Math.max(0.5, points[0].w), 0, Math.PI * 2);
                context.fill();
                context.restore();
                return;
            }

            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i];
                const p2 = points[i + 1];
                const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                const r1 = Math.max(0.5, p1.w);
                const r2 = Math.max(0.5, p2.w);

                context.beginPath();
                if (dist < 0.5) {
                    context.arc(p1.x, p1.y, r1, 0, Math.PI * 2);
                    context.fill();
                } else {
                    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                    const nx = Math.cos(angle + Math.PI / 2);
                    const ny = Math.sin(angle + Math.PI / 2);

                    context.moveTo(p1.x + nx * r1, p1.y + ny * r1);
                    context.lineTo(p2.x + nx * r2, p2.y + ny * r2);
                    context.arc(p2.x, p2.y, r2, angle + Math.PI / 2, angle - Math.PI / 2, true);
                    context.lineTo(p1.x - nx * r1, p1.y - ny * r1);
                    context.arc(p1.x, p1.y, r1, angle - Math.PI / 2, angle + Math.PI / 2, true);
                    context.closePath();
                    context.fill();
                }
            }
            context.restore();
        }

        function drawLassoFilledShape(context, points, color) {
            if (!points || points.length < 3) return;
            context.save();
            context.fillStyle = color;
            context.beginPath();
            context.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                context.lineTo(points[i].x, points[i].y);
            }
            context.closePath();
            context.fill();
            context.restore();
        }

        function getElementBoundingBox(el) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            if (el.type === 'stroke' && el.processedPoints) {
                el.processedPoints.forEach(pt => {
                    minX = Math.min(minX, pt.x - pt.w);
                    minY = Math.min(minY, pt.y - pt.w);
                    maxX = Math.max(maxX, pt.x + pt.w);
                    maxY = Math.max(maxY, pt.y + pt.w);
                });
            } else if (el.type === 'lassofill' && el.points) {
                el.points.forEach(pt => {
                    minX = Math.min(minX, pt.x);
                    minY = Math.min(minY, pt.y);
                    maxX = Math.max(maxX, pt.x);
                    maxY = Math.max(maxY, pt.y);
                });
            } else if (el.type === 'image') {
                minX = el.x;
                minY = el.y;
                maxX = el.x + el.width;
                maxY = el.y + el.height;
            }

            if (minX === Infinity) return null;
            return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
        }

        function getCombinedSelectionBounds() {
            if (state.selectedElements.length === 0) return null;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            const activeLayer = state.layers.find(l => l.id === state.activeLayerId);
            if (!activeLayer) return null;

            state.selectedElements.forEach(id => {
                const el = activeLayer.elements.find(item => item.id === id);
                if (el) {
                    const box = getElementBoundingBox(el);
                    if (box) {
                        minX = Math.min(minX, box.minX);
                        minY = Math.min(minY, box.minY);
                        maxX = Math.max(maxX, box.maxX);
                        maxY = Math.max(maxY, box.maxY);
                    }
                }
            });

            if (minX === Infinity) return null;
            return { x: minX - 6, y: minY - 6, width: maxX - minX + 12, height: maxY - minY + 12 };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(state.panOffset.x, state.panOffset.y);
            ctx.scale(state.zoom, state.zoom);

            // Render visible layer elements in bottom-to-top order so higher layers render on top
            [...state.layers].reverse().forEach(layer => {
                if (!layer.visible) return;

                layer.elements.forEach(el => {
                    const isSelected = state.selectedElements.includes(el.id);

                    if (el.type === 'stroke') {
                        drawTaperedStroke(ctx, el.processedPoints, el.color);
                    } else if (el.type === 'lassofill') {
                        drawLassoFilledShape(ctx, el.points, el.color);
                    } else if (el.type === 'image') {
                        ctx.save();
                        if (el.img && el.img.complete) {
                            ctx.drawImage(el.img, el.x, el.y, el.width, el.height);
                        }
                        ctx.restore();
                    }

                    if (isSelected) {
                        const box = getElementBoundingBox(el);
                        if (box) {
                            ctx.save();
                            ctx.strokeStyle = '#0f172a';
                            ctx.lineWidth = 1.5 / state.zoom;
                            ctx.setLineDash([4 / state.zoom, 4 / state.zoom]);
                            ctx.strokeRect(box.minX - 2, box.minY - 2, box.width + 4, box.height + 4);
                            ctx.restore();
                        }
                    }
                });
            });

            // Live local stroke preview
            if (state.isDrawing && state.currentPoints.length > 0) {
                const liveProcessed = processStrokePoints(
                    state.currentPoints,
                    state.brushSize,
                    state.velocityDynamics,
                    state.smoothingTolerance
                );
                drawTaperedStroke(ctx, liveProcessed, state.brushColor);
            }

            // Live lasso select indicator
            if (state.isLassoing && state.lassoPoints.length > 1) {
                ctx.save();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 1.5 / state.zoom;
                ctx.setLineDash([6 / state.zoom, 6 / state.zoom]);
                ctx.beginPath();
                state.lassoPoints.forEach((pt, idx) => {
                    if (idx === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.closePath();
                ctx.stroke();
                ctx.fillStyle = 'rgba(15, 23, 42, 0.08)';
                ctx.fill();
                ctx.restore();
            }

            // Live lasso fill shape preview
            if (state.isLassoFilling && state.lassoPoints.length > 1) {
                ctx.save();
                ctx.strokeStyle = state.brushColor;
                ctx.lineWidth = 1.5 / state.zoom;
                ctx.beginPath();
                state.lassoPoints.forEach((pt, idx) => {
                    if (idx === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.closePath();
                ctx.stroke();
                ctx.fillStyle = state.brushColor;
                ctx.globalAlpha = 0.3;
                ctx.fill();
                ctx.restore();
            }

            // Overall selection bounding box
            const selectionBox = getCombinedSelectionBounds();
            if (selectionBox) {
                ctx.save();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2 / state.zoom;
                ctx.strokeRect(selectionBox.x, selectionBox.y, selectionBox.width, selectionBox.height);
                
                ctx.fillStyle = '#ffffff';
                const handleSize = 8 / state.zoom;
                [
                    { x: selectionBox.x, y: selectionBox.y },
                    { x: selectionBox.x + selectionBox.width, y: selectionBox.y },
                    { x: selectionBox.x, y: selectionBox.y + selectionBox.height },
                    { x: selectionBox.x + selectionBox.width, y: selectionBox.y + selectionBox.height }
                ].forEach(h => {
                    ctx.fillRect(h.x - handleSize / 2, h.y - handleSize / 2, handleSize, handleSize);
                    ctx.strokeRect(h.x - handleSize / 2, h.y - handleSize / 2, handleSize, handleSize);
                });

                ctx.restore();
            }

            // Render Remote Multiplayer Cursors directly on Canvas
            drawRemoteCursors(ctx);

            ctx.restore();
        }

        function drawRemoteCursors(context) {
            if (!state.remoteCursors) return;

            Object.keys(state.remoteCursors).forEach(uid => {
                const c = state.remoteCursors[uid];
                if (c && typeof c.x === 'number' && typeof c.y === 'number') {
                    context.save();
                    context.translate(c.x, c.y);

                    const scale = 1 / Math.max(0.5, state.zoom);
                    context.scale(scale, scale);

                    // Pointer arrow icon
                    context.fillStyle = c.color || '#3b82f6';
                    context.strokeStyle = '#ffffff';
                    context.lineWidth = 1.5;

                    context.beginPath();
                    context.moveTo(0, 0);
                    context.lineTo(0, 16);
                    context.lineTo(4, 12);
                    context.lineTo(9, 18);
                    context.lineTo(12, 16);
                    context.lineTo(7, 10);
                    context.lineTo(14, 10);
                    context.closePath();
                    context.fill();
                    context.stroke();

                    // Name Tag pill
                    context.fillStyle = c.color || '#3b82f6';
                    context.font = 'bold 11px Inter, sans-serif';
                    const textWidth = context.measureText(c.name || 'Artist').width;

                    context.beginPath();
                    context.roundRect(14, 12, textWidth + 12, 20, 6);
                    context.fill();

                    context.fillStyle = '#ffffff';
                    context.fillText(c.name || 'Artist', 20, 26);

                    context.restore();
                }
            });
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);

            return {
                x: (clientX - rect.left - state.panOffset.x) / state.zoom,
                y: (clientY - rect.top - state.panOffset.y) / state.zoom,
                time: Date.now()
            };
        }

        function isPointInBox(pt, box) {
            if (!box) return false;
            return pt.x >= box.x && pt.x <= box.x + box.width && pt.y >= box.y && pt.y <= box.y + box.height;
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.button === 1 || state.tool === 'pan' || e.spaceKey) {
                state.isPanning = true;
                state.panStart = { x: e.clientX - state.panOffset.x, y: e.clientY - state.panOffset.y };
                canvas.style.cursor = 'grabbing';
                return;
            }

            const pt = getCanvasCoords(e);

            if (state.tool === 'lasso') {
                const selectionBox = getCombinedSelectionBounds();
                if (selectionBox && isPointInBox(pt, selectionBox)) {
                    state.isMovingSelection = true;
                    state.selectionDragStart = pt;
                    saveUndoState();
                    canvas.style.cursor = 'move';
                    return;
                } else {
                    state.selectedElements = [];
                    updateSelectionBar();
                    state.isLassoing = true;
                    state.lassoPoints = [pt];
                    render();
                    return;
                }
            }

            if (state.tool === 'brush') {
                state.isDrawing = true;
                state.currentPoints = [pt];
                render();
            } else if (state.tool === 'lassofill') {
                state.isLassoFilling = true;
                state.lassoPoints = [pt];
                render();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (state.isPanning) {
                state.panOffset.x = e.clientX - state.panStart.x;
                state.panOffset.y = e.clientY - state.panStart.y;
                render();
                return;
            }

            const pt = getCanvasCoords(e);

            // Broadcast cursor to room
            if (window.broadcastCursorPosition) {
                window.broadcastCursorPosition(pt);
            }

            if (state.tool === 'lasso' && !state.isLassoing && !state.isMovingSelection) {
                const selectionBox = getCombinedSelectionBounds();
                if (selectionBox && isPointInBox(pt, selectionBox)) {
                    canvas.style.cursor = 'move';
                } else {
                    canvas.style.cursor = 'crosshair';
                }
            }

            if (state.isMovingSelection) {
                const dx = pt.x - state.selectionDragStart.x;
                const dy = pt.y - state.selectionDragStart.y;
                state.selectionDragStart = pt;

                const activeLayer = state.layers.find(l => l.id === state.activeLayerId);
                if (activeLayer) {
                    state.selectedElements.forEach(id => {
                        const el = activeLayer.elements.find(item => item.id === id);
                        if (el) {
                            if (el.type === 'stroke' && el.processedPoints) {
                                el.processedPoints.forEach(p => { p.x += dx; p.y += dy; });
                            } else if (el.type === 'lassofill' && el.points) {
                                el.points.forEach(p => { p.x += dx; p.y += dy; });
                            } else if (el.type === 'image') {
                                el.x += dx;
                                el.y += dy;
                            }
                            if (window.updateElementInFirestore) {
                                window.updateElementInFirestore(el);
                            }
                        }
                    });
                }
                render();
                return;
            }

            if (state.isDrawing) {
                if (state.smoothing && state.currentPoints.length > 0) {
                    const lastPt = state.currentPoints[state.currentPoints.length - 1];
                    const dist = Math.hypot(pt.x - lastPt.x, pt.y - lastPt.y);
                    if (dist < 1.5) return;
                }
                state.currentPoints.push(pt);
                render();
            } else if (state.isLassoing || state.isLassoFilling) {
                state.lassoPoints.push(pt);
                render();
            }
        });

        canvas.addEventListener('pointerup', () => {
            if (state.isPanning) {
                state.isPanning = false;
                canvas.style.cursor = state.tool === 'pan' ? 'grab' : 'crosshair';
                return;
            }

            if (state.isMovingSelection) {
                state.isMovingSelection = false;
                canvas.style.cursor = state.tool === 'lasso' ? 'move' : 'crosshair';
                render();
                return;
            }

            if (state.isDrawing) {
                state.isDrawing = false;
                if (state.currentPoints.length > 0) {
                    const processed = processStrokePoints(
                        state.currentPoints,
                        state.brushSize,
                        state.velocityDynamics,
                        state.smoothingTolerance
                    );

                    const newStroke = {
                        id: 'stroke-' + Date.now() + Math.random().toString(36).substr(2, 4),
                        type: 'stroke',
                        color: state.brushColor,
                        size: state.brushSize,
                        processedPoints: processed
                    };

                    if (window.addStorageElement) {
                        window.addStorageElement(newStroke);
                    }
                }
                state.currentPoints = [];
                render();
            } else if (state.isLassoing) {
                state.isLassoing = false;
                evaluateLassoSelection();
                state.lassoPoints = [];
                render();
            } else if (state.isLassoFilling) {
                state.isLassoFilling = false;
                if (state.lassoPoints.length >= 3) {
                    const fillElement = {
                        id: 'fill-' + Date.now() + Math.random().toString(36).substr(2, 4),
                        type: 'lassofill',
                        color: state.brushColor,
                        points: [...state.lassoPoints]
                    };
                    if (window.addStorageElement) {
                        window.addStorageElement(fillElement);
                    }
                }
                state.lassoPoints = [];
                render();
            }
        });

        function pointInPolygon(point, vs) {
            let x = point.x, y = point.y;
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i].x, yi = vs[i].y;
                let xj = vs[j].x, yj = vs[j].y;
                let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function evaluateLassoSelection() {
            if (state.lassoPoints.length < 3) return;

            const activeLayer = state.layers.find(l => l.id === state.activeLayerId);
            if (!activeLayer) return;

            const selected = [];

            activeLayer.elements.forEach(el => {
                if (el.type === 'stroke' && el.processedPoints) {
                    const hit = el.processedPoints.some(pt => pointInPolygon(pt, state.lassoPoints));
                    if (hit) selected.push(el.id);
                } else if (el.type === 'lassofill' && el.points) {
                    const hit = el.points.some(pt => pointInPolygon(pt, state.lassoPoints));
                    if (hit) selected.push(el.id);
                } else if (el.type === 'image') {
                    const center = { x: el.x + el.width / 2, y: el.y + el.height / 2 };
                    if (pointInPolygon(center, state.lassoPoints)) selected.push(el.id);
                }
            });

            state.selectedElements = selected;
            updateSelectionBar();
        }

        function updateSelectionBar() {
            const bar = document.getElementById('selection-bar');
            const countSpan = document.getElementById('selected-count');
            if (state.selectedElements.length > 0) {
                countSpan.innerText = state.selectedElements.length;
                bar.classList.remove('hidden');
            } else {
                bar.classList.add('hidden');
            }
        }

        function duplicateSelection() {
            if (state.selectedElements.length === 0) return;
            saveUndoState();

            const activeLayer = state.layers.find(l => l.id === state.activeLayerId);
            const newSelections = [];

            state.selectedElements.forEach(id => {
                const el = activeLayer.elements.find(item => item.id === id);
                if (el) {
                    if (el.type === 'stroke') {
                        const dup = JSON.parse(JSON.stringify(el));
                        dup.id = 'stroke-' + Date.now() + Math.random().toString(36).substr(2, 4);
                        dup.processedPoints = dup.processedPoints.map(p => ({ ...p, x: p.x + 20, y: p.y + 20 }));
                        if (window.addStorageElement) window.addStorageElement(dup);
                        newSelections.push(dup.id);
                    } else if (el.type === 'lassofill') {
                        const dup = JSON.parse(JSON.stringify(el));
                        dup.id = 'fill-' + Date.now() + Math.random().toString(36).substr(2, 4);
                        dup.points = dup.points.map(p => ({ x: p.x + 20, y: p.y + 20 }));
                        if (window.addStorageElement) window.addStorageElement(dup);
                        newSelections.push(dup.id);
                    } else if (el.type === 'image') {
                        const dup = { ...el, id: 'img-' + Date.now(), x: el.x + 20, y: el.y + 20 };
                        if (window.addStorageElement) window.addStorageElement(dup);
                        newSelections.push(dup.id);
                    }
                }
            });

            state.selectedElements = newSelections;
            updateSelectionBar();
            render();
        }

        function deleteSelection() {
            if (state.selectedElements.length === 0) return;
            saveUndoState();

            const activeLayer = state.layers.find(l => l.id === state.activeLayerId);
            state.selectedElements.forEach(id => {
                if (window.deleteElementFromFirestore) {
                    window.deleteElementFromFirestore(id);
                }
            });

            activeLayer.elements = activeLayer.elements.filter(el => !state.selectedElements.includes(el.id));
            state.selectedElements = [];
            updateSelectionBar();
            render();
        }

        function saveUndoState() {
            state.undoStack.push(JSON.stringify(state.layers));
            state.redoStack = [];
        }

        function undo() {
            if (state.undoStack.length === 0) return;
            state.redoStack.push(JSON.stringify(state.layers));
            state.layers = JSON.parse(state.undoStack.pop());
            state.selectedElements = [];
            updateSelectionBar();
            render();
            updateLayersList();
        }

        function redo() {
            if (state.redoStack.length === 0) return;
            state.undoStack.push(JSON.stringify(state.layers));
            state.layers = JSON.parse(state.redoStack.pop());
            state.selectedElements = [];
            updateSelectionBar();
            render();
            updateLayersList();
        }

        function setTool(toolName) {
            state.tool = toolName;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'shadow-sm');
                btn.classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById(`tool-${toolName}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-slate-900', 'text-white', 'shadow-sm');
                activeBtn.classList.remove('text-slate-600');
            }
            canvas.style.cursor = toolName === 'pan' ? 'grab' : 'crosshair';
        }

        function updateBrushColor(color) {
            state.brushColor = color;
        }

        function setQuickColor(color) {
            state.brushColor = color;
            document.getElementById('color-picker').value = color;
        }

        function updateBrushSize(size) {
            state.brushSize = parseInt(size, 10);
            document.getElementById('size-val').innerText = `${size}px`;
        }

        function toggleVelocityDynamics(enabled) {
            state.velocityDynamics = enabled;
        }

        function toggleSmoothing(enabled) {
            state.smoothing = enabled;
        }

        function updateSmoothingLevel(val) {
            state.smoothingTolerance = parseInt(val, 10);
            document.getElementById('smoothing-val').innerText = `${val}px`;
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
            const newZoom = Math.min(Math.max(state.zoom * zoomFactor, 0.2), 5);

            const mouseX = e.clientX - canvas.getBoundingClientRect().left;
            const mouseY = e.clientY - canvas.getBoundingClientRect().top;

            state.panOffset.x = mouseX - (mouseX - state.panOffset.x) * (newZoom / state.zoom);
            state.panOffset.y = mouseY - (mouseY - state.panOffset.y) * (newZoom / state.zoom);
            state.zoom = newZoom;

            document.getElementById('zoom-level').innerText = `${Math.round(state.zoom * 100)}%`;
            render();
        }, { passive: false });

        function resetZoom() {
            state.zoom = 1;
            state.panOffset = { x: 0, y: 0 };
            document.getElementById('zoom-level').innerText = '100%';
            render();
        }

        function triggerImageUpload() {
            document.getElementById('image-loader').click();
        }

        function handleImageImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const aspect = img.width / img.height;
                    const width = Math.min(300, img.width);
                    const height = width / aspect;

                    const imageEl = {
                        id: 'img-' + Date.now(),
                        type: 'image',
                        img: img,
                        src: event.target.result,
                        x: (-state.panOffset.x + canvas.width / 2 - width / 2) / state.zoom,
                        y: (-state.panOffset.y + canvas.height / 2 - height / 2) / state.zoom,
                        width: width,
                        height: height
                    };

                    if (window.addStorageElement) {
                        window.addStorageElement(imageEl);
                    }
                    render();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function toggleLayersPanel() {
            const panel = document.getElementById('layers-panel');
            panel.classList.toggle('hidden');
        }

        function addLayer() {
            saveUndoState();
            const newId = 'layer-' + (state.layers.length + 1);
            state.layers.unshift({
                id: newId,
                name: `Layer ${state.layers.length + 1}`,
                visible: true,
                locked: false,
                elements: []
            });
            state.activeLayerId = newId;
            updateLayersList();
            render();
        }

        function moveLayerUp(layerId) {
            const index = state.layers.findIndex(l => l.id === layerId);
            if (index > 0) {
                saveUndoState();
                const temp = state.layers[index];
                state.layers[index] = state.layers[index - 1];
                state.layers[index - 1] = temp;
                updateLayersList();
                render();
            }
        }

        function moveLayerDown(layerId) {
            const index = state.layers.findIndex(l => l.id === layerId);
            if (index !== -1 && index < state.layers.length - 1) {
                saveUndoState();
                const temp = state.layers[index];
                state.layers[index] = state.layers[index + 1];
                state.layers[index + 1] = temp;
                updateLayersList();
                render();
            }
        }

        function updateLayersList() {
            const list = document.getElementById('layers-list');
            list.innerHTML = '';

            state.layers.forEach((layer, idx) => {
                const isActive = layer.id === state.activeLayerId;
                const div = document.createElement('div');
                div.className = `p-2 rounded-lg text-xs flex items-center justify-between cursor-pointer transition-all ${
                    isActive ? 'bg-slate-100 border border-slate-300 text-slate-900 font-semibold' : 'bg-slate-50 hover:bg-slate-100 text-slate-700'
                }`;

                div.onclick = () => {
                    state.activeLayerId = layer.id;
                    updateLayersList();
                };

                const isFirst = idx === 0;
                const isLast = idx === state.layers.length - 1;

                div.innerHTML = `
                    <div class="flex items-center space-x-2 truncate pr-1">
                        <i class="fa-solid fa-layer-group text-slate-400 flex-shrink-0"></i>
                        <span class="truncate">${layer.name}</span>
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <button onclick="event.stopPropagation(); moveLayerUp('${layer.id}')" ${isFirst ? 'disabled class="p-1 text-slate-300 cursor-not-allowed"' : 'class="p-1 hover:text-slate-900 text-slate-500"'} title="Move Up">
                            <i class="fa-solid fa-chevron-up"></i>
                        </button>
                        <button onclick="event.stopPropagation(); moveLayerDown('${layer.id}')" ${isLast ? 'disabled class="p-1 text-slate-300 cursor-not-allowed"' : 'class="p-1 hover:text-slate-900 text-slate-500"'} title="Move Down">
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <button onclick="event.stopPropagation(); toggleLayerVisibility('${layer.id}')" class="p-1 hover:text-slate-900 text-slate-500 ml-1" title="Toggle Visibility">
                            <i class="fa-solid ${layer.visible ? 'fa-eye' : 'fa-eye-slash text-slate-400'}"></i>
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function toggleLayerVisibility(layerId) {
            const layer = state.layers.find(l => l.id === layerId);
            if (layer) {
                layer.visible = !layer.visible;
                render();
                updateLayersList();
            }
        }

        function exportPNG() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');

            tCtx.fillStyle = '#FFFFFF';
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);

            const link = document.createElement('a');
            link.download = `vector-room-${state.currentRoomId}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }

        function updateRoomLabel() {
            const label = document.getElementById('room-code-label');
            if (label) {
                label.innerText = `Room: ${state.currentRoomId}`;
            }
        }

        function updateCollaboratorsUI() {
            const container = document.getElementById('collaborators-container');
            if (!container) return;

            container.innerHTML = '';
            const users = Object.values(state.collaborators || {});

            users.forEach(u => {
                const avatar = document.createElement('div');
                avatar.className = 'w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold text-white border-2 border-white shadow-sm cursor-pointer';
                avatar.style.backgroundColor = u.color || '#3b82f6';
                avatar.title = u.name || 'Collaborator';
                avatar.innerText = (u.name || 'A').charAt(0).toUpperCase();
                container.appendChild(avatar);
            });

            if (users.length > 0) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function copyRoomLink() {
            const url = `${window.location.origin}${window.location.pathname}#room=${encodeURIComponent(state.currentRoomId)}`;
            
            const tempInput = document.createElement('input');
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast('Room link copied to clipboard!', 'success');
        }

        function openRoomModal() {
            document.getElementById('room-input').value = state.currentRoomId;
            document.getElementById('user-name-input').value = state.userName;
            document.getElementById('room-modal').classList.remove('hidden');
        }

        function closeRoomModal() {
            document.getElementById('room-modal').classList.add('hidden');
        }

        function switchRoomFromModal() {
            const newRoom = document.getElementById('room-input').value.trim();
            const newName = document.getElementById('user-name-input').value.trim();

            if (newName) {
                state.userName = newName;
            }

            if (newRoom && window.switchRoom) {
                window.switchRoom(newRoom);
            }

            closeRoomModal();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bg = type === 'success' ? 'bg-emerald-800' : type === 'warning' ? 'bg-amber-800' : 'bg-slate-800';
            toast.className = `${bg} text-white text-xs px-3 py-2 rounded-xl shadow-xl flex items-center space-x-2 transition-all duration-300 transform translate-x-10 opacity-0 pointer-events-auto`;
            
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-sky-400'}"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-10', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-x-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undo();
            } else if (e.ctrlKey && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                redo();
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                deleteSelection();
            } else if (e.code === 'Space' && !e.repeat) {
                setTool('pan');
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                setTool('brush');
            }
        });

        window.onload = function() {
            resizeCanvas();
            updateLayersList();
            if (window.initMultiplayer) {
                window.initMultiplayer();
            }
        };
    </script>
</body>
</html>
